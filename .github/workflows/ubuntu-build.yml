name: Ubuntu Build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  ubuntu_build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson libcanberra-dev dbus-daemon xvfb xauth libglib2.0-dev libgtk-3-dev libluajit-5.1-dev libpci-dev libperl-dev libssl-dev python3-dev python3-cffi mono-devel desktop-file-utils gettext

      - name: Configure
        run: meson setup build -Dtext-frontend=true -Dtheme-manager=true -Dauto_features=enabled

      - name: Build
        run: ninja -C build

      # Includes appdata validation, which runs offline (appstream-util --nonet).
      - name: Test
        run: ninja -C build test
