name: Flatpak Build (GTK3 port pending, manual only)
# Inherited from the GTK2 tree and NOT ported to GTK3: it is expected to fail
# on this branch. Automatic triggers are disabled; run it by hand only.
# See docs/maintenance/gtk3-status.md.
on:
  workflow_dispatch:

# Read-only token.
permissions:
  contents: read

jobs:
  flatpak_build:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-40
      options: --privileged
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true

    - uses: bilelmoussaoui/flatpak-github-actions/flatpak-builder@v3
      with:
        bundle: hexchat.flatpak
        manifest-path: flatpak/io.github.Hexchat.json
