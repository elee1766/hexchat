name: Debian 13 GTK3
on:
  push:
    branches:
      - master
      - 'cog/**'
  pull_request:
    branches:
      - master

# Read-only: no secrets, no deployment, no artifact upload, no token write scopes.
permissions:
  contents: read

jobs:
  debian13:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential meson ninja-build pkg-config gettext \
            desktop-file-utils appstream appstream-util libglib2.0-dev libgtk-3-dev \
            libssl-dev libcanberra-dev dbus-daemon libluajit-5.1-dev \
            libpci-dev libperl-dev python3-dev python3-cffi \
            openssl librsvg2-common xvfb xauth xdotool xclip x11-apps openbox imagemagick dbus-x11 fonts-dejavu-core

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure
        run: meson setup build -Dtext-frontend=true -Dtheme-manager=false -Dtls=enabled

      - name: Build (all default targets and plugins)
        run: ninja -C build

      - name: Verify every default plugin was built
        run: |
          for p in checksum fishlim lua perl python sysinfo; do
            test -s build/plugins/$p/$p.so || { echo "missing plugin $p"; exit 1; }
          done
          test -x build/src/fe-gtk/hexchat
          test -x build/src/fe-text/hexchat-text

      - name: Unit and private session-bus integration tests
        run: |
          useradd -m tester
          chown -R tester .
          su tester -c "meson test -C build --print-errorlogs"

      - name: App-id D-Bus service and disabled build
        run: |
          su tester -c "meson configure build -Ddbus-service-use-appid=true && meson compile -C build && meson test -C build --print-errorlogs 'D-Bus scripting API' 'D-Bus GTK single instance'"
          meson setup build-no-dbus -Ddbus=disabled -Dgtk-frontend=false -Dtext-frontend=true -Dwith-lua=false -Dwith-perl=false -Dwith-python=false -Dwith-sysinfo=false -Dwith-fishlim=false
          meson compile -C build-no-dbus
          meson test -C build-no-dbus --print-errorlogs

      - name: TLS IRC end-to-end test (loopback only)
        run: |
          chmod -R a+rX .
          su tester -c "./ci/tls-irc-test.sh build"

      - name: GUI tests (Xvfb)
        run: |
          # HexChat refuses to run unattended as root
          mkdir -p /tmp/gui && chown tester /tmp/gui
          su tester -c "TMPDIR=/tmp/gui ./ci/gui-test.sh build"
